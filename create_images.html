<!DOCTYPE html>
<html>
<head>
    <style>
        .mockup {
            width: 800px;
            height: 450px;
            background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 20px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .mockup h2 {
            font-size: 48px;
            margin-bottom: 20px;
            text-align: center;
        }
        .mockup p {
            font-size: 24px;
            text-align: center;
            opacity: 0.9;
        }
        .dashboard {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }
        .analytics {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        }
    </style>
</head>
<body>
    <div class="mockup">
        <h2>ConnectiveRx Platform</h2>
        <p>Technical Leadership & Cloud Solutions</p>
    </div>
    
    <div class="mockup dashboard">
        <h2>Ashley OMS Modernization</h2>
        <p>Product Strategy & System Architecture</p>
    </div>
    
    <div class="mockup analytics">
        <h2>Agilysys Loyalty System</h2>
        <p>Product Development & Go-to-Market</p>
    </div>
</body>
</html>
